name: Build Android APK

on:
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-mosh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache mosh binary
        id: mosh-cache
        uses: actions/cache@v4
        with:
          path: app/src/main/assets/bin/mosh-client
          key: mosh-client-arm64-v3

      - name: Install build dependencies
        if: steps.mosh-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq autoconf automake libtool pkg-config protobuf-compiler

      - name: Setup Android NDK
        if: steps.mosh-cache.outputs.cache-hit != 'true'
        uses: android-actions/setup-android@v3

      - name: Install NDK
        if: steps.mosh-cache.outputs.cache-hit != 'true'
        run: sdkmanager "ndk;27.2.12479018"

      - name: Build mosh-client for arm64
        if: steps.mosh-cache.outputs.cache-hit != 'true'
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.2.12479018"
          bash build-mosh.sh "$ANDROID_NDK_HOME"
          ls -la app/src/main/assets/bin/mosh-client

      - name: Upload mosh binary
        uses: actions/upload-artifact@v4
        with:
          name: mosh-client-arm64
          path: app/src/main/assets/bin/mosh-client

  build-android:
    runs-on: ubuntu-latest
    needs: build-mosh
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download mosh binary
        uses: actions/download-artifact@v4
        with:
          name: mosh-client-arm64
          path: app/src/main/assets/bin/

      - name: Make mosh executable
        run: chmod +x app/src/main/assets/bin/mosh-client 2>/dev/null || true

      - name: Auto-increment version
        id: version
        run: |
          # Get latest tag, default to v2.0.0 if none
          LATEST=$(git describe --tags --abbrev=0 2>/dev/null || echo "v2.0.0")
          LATEST="${LATEST#v}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$LATEST"

          # Bump patch version
          PATCH=$((PATCH + 1))
          VER="${MAJOR}.${MINOR}.${PATCH}"

          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "tag=v$VER" >> "$GITHUB_OUTPUT"
          echo "Version: $VER (previous: $LATEST)"

      - name: Sync version into build.gradle.kts
        run: |
          VER="${{ steps.version.outputs.version }}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VER"
          VCODE=$((MAJOR * 10000 + MINOR * 100 + PATCH))
          sed -i "s/versionName = \"[^\"]*\"/versionName = \"$VER\"/" app/build.gradle.kts
          sed -i "s/versionCode = [0-9]*/versionCode = $VCODE/" app/build.gradle.kts
          echo "Version: $VER (code: $VCODE)"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Generate icons from SVG
        run: |
          sudo apt-get install -y -qq librsvg2-bin
          SVG="app/src/main/res/icon.svg"
          if [ -f "$SVG" ]; then
            declare -A SIZES=( [mdpi]=48 [hdpi]=72 [xhdpi]=96 [xxhdpi]=144 [xxxhdpi]=192 )
            for density in "${!SIZES[@]}"; do
              DIR="app/src/main/res/mipmap-$density"
              mkdir -p "$DIR"
              rsvg-convert -w ${SIZES[$density]} -h ${SIZES[$density]} "$SVG" > "$DIR/ic_launcher.png"
            done
            echo "Icons generated from SVG"
          else
            echo "No SVG found, using existing PNGs"
          fi

      - name: Build Release APK
        run: gradle assembleRelease

      - name: Sign APK
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          echo "$ANDROID_KEYSTORE" | base64 -d > /tmp/release.keystore
          APK=$(find app/build/outputs/apk/release/ -name "*.apk" -type f | head -1)
          BT=${ANDROID_HOME}/build-tools/$(ls ${ANDROID_HOME}/build-tools/ | tail -1)

          ${BT}/zipalign -v 4 "$APK" /tmp/aligned.apk
          ${BT}/apksigner sign \
            --ks /tmp/release.keystore \
            --ks-key-alias vscodetunnel \
            --ks-pass "pass:${ANDROID_KEYSTORE_PASSWORD}" \
            --key-pass "pass:${ANDROID_KEYSTORE_PASSWORD}" \
            --out VSCodeTunnel.apk /tmp/aligned.apk
          ${BT}/apksigner verify VSCodeTunnel.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: VSCodeTunnel-Android
          path: VSCodeTunnel.apk

      - name: Create tag and release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          git tag "$TAG"
          git push origin "$TAG"
          gh release create "$TAG" VSCodeTunnel.apk \
            --title "$TAG" \
            --generate-notes

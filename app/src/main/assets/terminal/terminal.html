<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/css/xterm.min.css" />
<style>
* { margin:0; padding:0; box-sizing:border-box; }
html, body { background:#1E1E1E; overflow:hidden; width:100%; height:100%; display:flex; flex-direction:column; }
#snippetBar { display:none; gap:4px; padding:3px 8px; background:#1a1a1a; overflow-x:auto; flex-shrink:0; }
#snippetBar::-webkit-scrollbar { display:none; }
.snip-btn { padding:4px 8px; font-size:11px; font-family:'Droid Sans Mono',monospace; background:rgba(255,255,255,0.06); color:#bbb; border:1px solid rgba(255,255,255,0.1); border-radius:3px; cursor:pointer; white-space:nowrap; touch-action:manipulation; }
.snip-btn:active { background:rgba(0,122,204,0.3); }
#terminal { flex:1; min-height:0; touch-action:none; }
.xterm { height:100%; }
/* Toast notification */
#toast { position:fixed; bottom:60px; left:50%; transform:translateX(-50%); padding:6px 16px; background:rgba(0,122,204,0.85); color:#fff; font-size:12px; font-family:-apple-system,sans-serif; border-radius:16px; pointer-events:none; opacity:0; transition:opacity 0.2s; z-index:100; }
#toast.show { opacity:1; }
/* Context menu */
#ctxMenu { position:fixed; display:none; background:#2d2d2d; border:1px solid rgba(255,255,255,0.15); border-radius:8px; padding:4px 0; z-index:200; box-shadow:0 4px 16px rgba(0,0,0,0.5); min-width:140px; }
.ctx-item { display:block; width:100%; padding:10px 16px; font-size:14px; font-family:-apple-system,sans-serif; color:#ddd; background:none; border:none; text-align:left; cursor:pointer; }
.ctx-item:active { background:rgba(0,122,204,0.3); }
.ctx-sep { height:1px; background:rgba(255,255,255,0.1); margin:4px 0; }
/* Search bar */
#searchBar { display:none; align-items:center; gap:4px; padding:4px 8px; background:#252525; border-bottom:1px solid rgba(255,255,255,0.1); flex-shrink:0; }
#searchInput { flex:1; padding:6px 10px; font-size:13px; background:rgba(255,255,255,0.08); color:#ddd; border:1px solid rgba(255,255,255,0.15); border-radius:4px; outline:none; font-family:-apple-system,sans-serif; }
#searchInput:focus { border-color:#007acc; }
.search-btn { padding:6px 10px; font-size:12px; font-family:-apple-system,sans-serif; background:rgba(255,255,255,0.08); color:#aaa; border:none; border-radius:4px; cursor:pointer; }
.search-btn:active { background:rgba(0,122,204,0.3); }
#searchCount { font-size:11px; color:#888; font-family:-apple-system,sans-serif; min-width:40px; text-align:center; }
/* Selection handles (Android-style teardrops) */
.sel-handle { position:fixed; width:28px; height:28px; z-index:150; display:none; touch-action:none; }
.sel-handle svg { width:100%; height:100%; filter:drop-shadow(0 1px 2px rgba(0,0,0,0.5)); }
/* Selection floating toolbar (Android-style, above selection) */
#selToolbar { position:fixed; display:none; z-index:250; background:#363636; border-radius:20px; padding:2px 4px; box-shadow:0 2px 12px rgba(0,0,0,0.6); flex-direction:row; align-items:center; gap:0; }
.sel-action { padding:8px 14px; font-size:13px; font-family:-apple-system,sans-serif; color:#eee; background:none; border:none; cursor:pointer; border-radius:16px; white-space:nowrap; }
.sel-action:active { background:rgba(255,255,255,0.12); }
</style>
</head>
<body>
<div id="searchBar">
    <input id="searchInput" type="text" placeholder="Search..." inputmode="none">
    <span id="searchCount"></span>
    <button class="search-btn" id="searchPrev">&#9650;</button>
    <button class="search-btn" id="searchNext">&#9660;</button>
    <button class="search-btn" id="searchClose">&#10005;</button>
</div>
<div id="snippetBar"></div>
<div id="terminal"></div>
<div id="toast"></div>
<!-- Selection handles (Android teardrop style) -->
<div class="sel-handle" id="handleLeft"><svg viewBox="0 0 28 28"><circle cx="14" cy="6" r="6" fill="#007acc"/><rect x="12" y="6" width="4" height="16" rx="2" fill="#007acc"/></svg></div>
<div class="sel-handle" id="handleRight"><svg viewBox="0 0 28 28"><circle cx="14" cy="6" r="6" fill="#007acc"/><rect x="12" y="6" width="4" height="16" rx="2" fill="#007acc"/></svg></div>
<div id="selToolbar">
    <button class="sel-action" id="selCopy">Copy</button>
    <button class="sel-action" id="selAll">All</button>
    <button class="sel-action" id="selPaste">Paste</button>
</div>
<div id="ctxMenu">
    <button class="ctx-item" id="ctxCopy">Copy</button>
    <button class="ctx-item" id="ctxPaste">Paste</button>
    <div class="ctx-sep"></div>
    <button class="ctx-item" id="ctxSelectAll">Select All</button>
    <button class="ctx-item" id="ctxClear">Clear</button>
    <div class="ctx-sep"></div>
    <button class="ctx-item" id="ctxSearch">Search</button>
    <button class="ctx-item" id="ctxExport">Export Log</button>
</div>
<script src="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/lib/xterm.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@xterm/addon-fit@0.10.0/lib/addon-fit.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@xterm/addon-search@0.15.0/lib/addon-search.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@xterm/addon-web-links@0.11.0/lib/addon-web-links.min.js"></script>
<script>
'use strict';

const A = window.Android;

function showToast(msg, ms) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), ms || 1200);
}

// ======================== COLOR SCHEMES ========================
const SCHEMES = {
    'default': {
        background:'#1E1E1E', foreground:'#CCCCCC', cursor:'#AEAFAD', selectionBackground:'#264F78',
        black:'#000000', red:'#CD3131', green:'#0DBC79', yellow:'#E5E510',
        blue:'#2472C8', magenta:'#BC3FBC', cyan:'#11A8CD', white:'#E5E5E5',
        brightBlack:'#666666', brightRed:'#F14C4C', brightGreen:'#23D18B', brightYellow:'#F5F543',
        brightBlue:'#3B8EEA', brightMagenta:'#D670D6', brightCyan:'#29B8DB', brightWhite:'#FFFFFF'
    },
    'solarized-dark': {
        background:'#002B36', foreground:'#839496', cursor:'#93A1A1', selectionBackground:'#073642',
        black:'#073642', red:'#DC322F', green:'#859900', yellow:'#B58900',
        blue:'#268BD2', magenta:'#D33682', cyan:'#2AA198', white:'#EEE8D5',
        brightBlack:'#586E75', brightRed:'#CB4B16', brightGreen:'#586E75', brightYellow:'#657B83',
        brightBlue:'#839496', brightMagenta:'#6C71C4', brightCyan:'#93A1A1', brightWhite:'#FDF6E3'
    },
    'dracula': {
        background:'#282A36', foreground:'#F8F8F2', cursor:'#F8F8F2', selectionBackground:'#44475A',
        black:'#21222C', red:'#FF5555', green:'#50FA7B', yellow:'#F1FA8C',
        blue:'#BD93F9', magenta:'#FF79C6', cyan:'#8BE9FD', white:'#F8F8F2',
        brightBlack:'#6272A4', brightRed:'#FF6E6E', brightGreen:'#69FF94', brightYellow:'#FFFFA5',
        brightBlue:'#D6ACFF', brightMagenta:'#FF92DF', brightCyan:'#A4FFFF', brightWhite:'#FFFFFF'
    },
    'monokai': {
        background:'#272822', foreground:'#F8F8F2', cursor:'#F8F8F2', selectionBackground:'#49483E',
        black:'#272822', red:'#F92672', green:'#A6E22E', yellow:'#F4BF75',
        blue:'#66D9EF', magenta:'#AE81FF', cyan:'#A1EFE4', white:'#F8F8F2',
        brightBlack:'#75715E', brightRed:'#F92672', brightGreen:'#A6E22E', brightYellow:'#F4BF75',
        brightBlue:'#66D9EF', brightMagenta:'#AE81FF', brightCyan:'#A1EFE4', brightWhite:'#F9F8F5'
    },
    'linux': {
        background:'#000000', foreground:'#AAAAAA', cursor:'#AAAAAA', selectionBackground:'#333333',
        black:'#000000', red:'#AA0000', green:'#00AA00', yellow:'#AA5500',
        blue:'#0000AA', magenta:'#AA00AA', cyan:'#00AAAA', white:'#AAAAAA',
        brightBlack:'#555555', brightRed:'#FF5555', brightGreen:'#55FF55', brightYellow:'#FFFF55',
        brightBlue:'#5555FF', brightMagenta:'#FF55FF', brightCyan:'#55FFFF', brightWhite:'#FFFFFF'
    }
};
let currentSchemeIdx = 0;
const schemeNames = Object.keys(SCHEMES);

// ======================== TERMINAL ========================
const term = new Terminal({
    cursorBlink: true,
    fontSize: 14,
    fontFamily: "'Droid Sans Mono', 'Noto Sans Mono', 'Liberation Mono', monospace",
    theme: SCHEMES['default'],
    allowTransparency: false,
    scrollback: 10000,
    convertEol: true,
    rightClickSelectsWord: true,
    allowProposedApi: true
});

const fitAddon = new FitAddon.FitAddon();
term.loadAddon(fitAddon);

// Search addon
const searchAddon = new SearchAddon.SearchAddon();
term.loadAddon(searchAddon);

// Web links addon — clickable URLs
const webLinksAddon = new WebLinksAddon.WebLinksAddon((e, uri) => {
    if (A) A.openUrl(uri);
});
term.loadAddon(webLinksAddon);

term.open(document.getElementById('terminal'));
fitAddon.fit();

// Send user input to Android
term.onData(data => { if (A) A.onTerminalInput(data); });

// ======================== SEARCH ========================
const searchBar = document.getElementById('searchBar');
const searchInput = document.getElementById('searchInput');
const searchCount = document.getElementById('searchCount');
let searchOpen = false;

function toggleSearch() {
    searchOpen = !searchOpen;
    searchBar.style.display = searchOpen ? 'flex' : 'none';
    if (searchOpen) { searchInput.focus(); searchInput.removeAttribute('inputmode'); }
    else { searchAddon.clearDecorations(); searchCount.textContent = ''; fitAddon.fit(); }
}

searchInput.addEventListener('input', () => {
    const q = searchInput.value;
    if (q) searchAddon.findNext(q);
    else searchAddon.clearDecorations();
});
document.getElementById('searchNext').addEventListener('click', () => {
    if (searchInput.value) searchAddon.findNext(searchInput.value);
});
document.getElementById('searchPrev').addEventListener('click', () => {
    if (searchInput.value) searchAddon.findPrevious(searchInput.value);
});
document.getElementById('searchClose').addEventListener('click', toggleSearch);

// ======================== CONTEXT MENU ========================
const ctxMenu = document.getElementById('ctxMenu');
const termEl = document.getElementById('terminal');

function showCtxMenu(x, y) {
    const mw = ctxMenu.offsetWidth || 140, mh = ctxMenu.offsetHeight || 200;
    const mx = Math.min(x, window.innerWidth - mw - 8);
    const my = Math.min(y, window.innerHeight - mh - 8);
    ctxMenu.style.left = Math.max(4, mx) + 'px';
    ctxMenu.style.top = Math.max(4, my) + 'px';
    ctxMenu.style.display = 'block';
    const hasSel = term.hasSelection();
    document.getElementById('ctxCopy').style.opacity = hasSel ? '1' : '0.4';
}

function hideCtxMenu() { ctxMenu.style.display = 'none'; }

// 2-finger tap → context menu (keeps single-finger free for xterm text selection)
// Track 2-finger gesture to distinguish tap from pinch
let twoFingerStart = 0, twoFingerMoved = false, twoFingerPos = {x:0,y:0};
termEl.addEventListener('touchstart', e => {
    if (e.touches.length === 2) {
        twoFingerStart = Date.now();
        twoFingerMoved = false;
        twoFingerPos = {
            x: (e.touches[0].clientX + e.touches[1].clientX) / 2,
            y: (e.touches[0].clientY + e.touches[1].clientY) / 2
        };
    }
}, {passive:true});
termEl.addEventListener('touchmove', e => {
    if (e.touches.length === 2) twoFingerMoved = true;
}, {passive:true});
termEl.addEventListener('touchend', e => {
    // 2-finger short tap without movement → context menu
    if (twoFingerStart > 0 && !twoFingerMoved && Date.now() - twoFingerStart < 400) {
        showCtxMenu(twoFingerPos.x, twoFingerPos.y);
    }
    if (e.touches.length === 0) twoFingerStart = 0;
}, {passive:true});

// Dismiss menu/toolbar on single tap outside
document.addEventListener('touchstart', e => {
    if (e.touches.length === 1) {
        if (ctxMenu.style.display === 'block' && !ctxMenu.contains(e.target))
            hideCtxMenu();
        if (selToolbar.style.display === 'flex' && !selToolbar.contains(e.target)
            && e.target !== handleLeft && e.target !== handleRight
            && !handleLeft.contains(e.target) && !handleRight.contains(e.target)) {
            // Delay to let xterm process the tap first (may create new selection)
            setTimeout(() => {
                if (!term.hasSelection()) { hideSelToolbar(); updateHandles(); }
            }, 100);
        }
    }
}, {passive:true});

// Context menu actions
document.getElementById('ctxCopy').addEventListener('click', () => {
    hideCtxMenu();
    const sel = term.getSelection();
    if (sel && A) { A.copyToClipboard(sel); showToast('Copied'); }
});

document.getElementById('ctxPaste').addEventListener('click', () => {
    hideCtxMenu();
    if (A) {
        const text = A.getClipboard();
        if (text) { A.onTerminalInput(text); showToast('Pasted'); }
    }
});

document.getElementById('ctxSelectAll').addEventListener('click', () => {
    hideCtxMenu();
    term.selectAll();
});

document.getElementById('ctxClear').addEventListener('click', () => {
    hideCtxMenu();
    term.clear();
});

document.getElementById('ctxSearch').addEventListener('click', () => {
    hideCtxMenu();
    if (!searchOpen) toggleSearch();
});

document.getElementById('ctxExport').addEventListener('click', () => {
    hideCtxMenu();
    exportScrollback();
    showToast('Exporting...');
});

// ======================== SELECTION HANDLES ========================
const handleLeft = document.getElementById('handleLeft');
const handleRight = document.getElementById('handleRight');
let draggingHandle = null;

function getCellSize() {
    // xterm.js internal cell dimensions
    try {
        const dims = term._core._renderService.dimensions;
        return { w: dims.css.cell.width, h: dims.css.cell.height };
    } catch(_) {
        // Fallback: measure from DOM
        const screen = document.querySelector('.xterm-screen');
        if (!screen) return { w:8, h:16 };
        return { w: screen.clientWidth / term.cols, h: screen.clientHeight / term.rows };
    }
}

function getScreenRect() {
    const screen = document.querySelector('.xterm-screen');
    return screen ? screen.getBoundingClientRect() : {left:0,top:0,width:0,height:0};
}

function posToCell(px, py) {
    const rect = getScreenRect();
    const cell = getCellSize();
    const col = Math.round((px - rect.left) / cell.w);
    const row = Math.round((py - rect.top) / cell.h);
    return { col: Math.max(0, Math.min(col, term.cols - 1)), row: Math.max(0, row) };
}

function updateHandles() {
    const pos = term.getSelectionPosition();
    if (!pos || !term.hasSelection()) {
        handleLeft.style.display = 'none';
        handleRight.style.display = 'none';
        return;
    }
    const rect = getScreenRect();
    const cell = getCellSize();
    const viewportRow = term.buffer.active.viewportY;

    // Start handle (left edge of selection)
    const sx = rect.left + pos.start.x * cell.w;
    const sy = rect.top + (pos.start.y - viewportRow) * cell.h;
    handleLeft.style.left = (sx - 14) + 'px';
    handleLeft.style.top = (sy + cell.h) + 'px';
    handleLeft.style.display = 'block';

    // End handle (right edge of selection)
    const ex = rect.left + pos.end.x * cell.w;
    const ey = rect.top + (pos.end.y - viewportRow) * cell.h;
    handleRight.style.left = (ex - 14) + 'px';
    handleRight.style.top = (ey + cell.h) + 'px';
    handleRight.style.display = 'block';
}

const selToolbar = document.getElementById('selToolbar');

function showSelToolbar() {
    const pos = term.getSelectionPosition();
    if (!pos || !term.hasSelection()) { selToolbar.style.display = 'none'; return; }
    const rect = getScreenRect();
    const cell = getCellSize();
    const viewportRow = term.buffer.active.viewportY;

    // Selection top and bottom edges in screen coordinates
    const selTop = rect.top + (pos.start.y - viewportRow) * cell.h;
    const selBottom = rect.top + (pos.end.y - viewportRow + 1) * cell.h;
    const sx = rect.left + pos.start.x * cell.w;
    const ex = rect.left + pos.end.x * cell.w;
    const midX = (pos.start.y === pos.end.y) ? (sx + ex) / 2 : window.innerWidth / 2;

    selToolbar.style.display = 'flex';
    const tw = selToolbar.offsetWidth;
    const th = selToolbar.offsetHeight || 40;
    const handleHeight = 32; // teardrop handle height
    const gap = 8; // minimum gap between toolbar and selection/handles

    // Try above selection first (with room for gap)
    let toolbarY = selTop - th - gap;
    if (toolbarY < 4) {
        // Not enough room above → place below selection + handles
        toolbarY = selBottom + handleHeight + gap;
    }
    // Final clamp to viewport
    toolbarY = Math.max(4, Math.min(toolbarY, window.innerHeight - th - 4));

    const toolbarX = Math.max(4, Math.min(midX - tw / 2, window.innerWidth - tw - 4));
    selToolbar.style.left = toolbarX + 'px';
    selToolbar.style.top = toolbarY + 'px';
}

function hideSelToolbar() { selToolbar.style.display = 'none'; }

term.onSelectionChange(() => {
    if (term.hasSelection()) {
        updateHandles();
        showSelToolbar();
    } else {
        updateHandles();
        hideSelToolbar();
    }
});

// Selection toolbar actions
document.getElementById('selCopy').addEventListener('click', () => {
    const sel = term.getSelection();
    if (sel && A) { A.copyToClipboard(sel); showToast('Copied'); }
    term.clearSelection();
    hideSelToolbar();
});
document.getElementById('selAll').addEventListener('click', () => {
    term.selectAll();
});
document.getElementById('selPaste').addEventListener('click', () => {
    term.clearSelection();
    hideSelToolbar();
    if (A) {
        const text = A.getClipboard();
        if (text) { A.onTerminalInput(text); showToast('Pasted'); }
    }
});

// Handle dragging
function handleDrag(e, handle) {
    e.preventDefault();
    draggingHandle = handle;
}

handleLeft.addEventListener('touchstart', e => { e.preventDefault(); draggingHandle = 'left'; hideSelToolbar(); }, {passive:false});
handleRight.addEventListener('touchstart', e => { e.preventDefault(); draggingHandle = 'right'; hideSelToolbar(); }, {passive:false});

document.addEventListener('touchmove', e => {
    if (!draggingHandle) return;
    e.preventDefault();
    const touch = e.touches[0];
    const cell = posToCell(touch.clientX, touch.clientY);
    const pos = term.getSelectionPosition();
    if (!pos) return;
    const viewportRow = term.buffer.active.viewportY;

    if (draggingHandle === 'left') {
        // Move start of selection
        const startRow = cell.row + viewportRow;
        const endRow = pos.end.y;
        const endCol = pos.end.x;
        if (startRow < endRow || (startRow === endRow && cell.col < endCol)) {
            const len = (endRow - startRow) * term.cols + (endCol - cell.col);
            term.select(cell.col, startRow, len);
        }
    } else {
        // Move end of selection
        const startRow = pos.start.y;
        const startCol = pos.start.x;
        const endRow = cell.row + viewportRow;
        if (endRow > startRow || (endRow === startRow && cell.col > startCol)) {
            const len = (endRow - startRow) * term.cols + (cell.col - startCol);
            term.select(startCol, startRow, len);
        }
    }
    updateHandles();
}, {passive:false});

document.addEventListener('touchend', () => {
    if (draggingHandle) {
        draggingHandle = null;
        if (term.hasSelection()) showSelToolbar();
    }
}, {passive:true});

// ======================== TOUCHPAD CURSOR (called from Android) ========================
// Hybrid: dispatch real MouseEvent on .xterm (for mouse-aware apps like mc/vim)
// AND use xterm.js API (for selection in plain shell).

let tpCursorCol = -1, tpCursorRow = -1;

function pxToCell(x, y) {
    const rect = getScreenRect();
    const cell = getCellSize();
    return {
        col: Math.max(0, Math.min(Math.floor((x - rect.left) / cell.w), term.cols - 1)),
        row: Math.max(0, Math.min(Math.floor((y - rect.top) / cell.h), term.rows - 1))
    };
}

// Convert cell coordinates to clientX/clientY for MouseEvent
function cellToPx(col, row) {
    const rect = getScreenRect();
    const cell = getCellSize();
    return { x: rect.left + col * cell.w + cell.w / 2, y: rect.top + row * cell.h + cell.h / 2 };
}

function dispatchRealMouse(type, x, y, button) {
    // Dispatch on .xterm for mouse-aware programs, mouseup on document
    const target = (type === 'mouseup') ? document : document.querySelector('.xterm');
    if (!target) return;
    const btnMask = (type === 'mouseup') ? 0 : (button === 0 ? 1 : button === 2 ? 2 : 4);
    target.dispatchEvent(new MouseEvent(type, {
        clientX: x, clientY: y, button: button || 0, buttons: btnMask,
        bubbles: true, cancelable: true, view: window
    }));
}

function injectMouse(type, x, y, button, buttons) {
    const c = pxToCell(x, y);
    const px = cellToPx(c.col, c.row);
    tpCursorCol = c.col;
    tpCursorRow = c.row;

    // Always dispatch real MouseEvent (works for mc, vim, htop)
    dispatchRealMouse(type, px.x, px.y, button);

    // Also use xterm API for plain shell selection/focus
    if (type === 'click') {
        term.clearSelection();
        term.focus();
    } else if (type === 'dblclick') {
        dispatchRealMouse('mousedown', px.x, px.y, 0);
        dispatchRealMouse('mouseup', px.x, px.y, 0);
        dispatchRealMouse('mousedown', px.x, px.y, 0);
        dispatchRealMouse('mouseup', px.x, px.y, 0);
        const el = document.querySelector('.xterm');
        if (el) el.dispatchEvent(new MouseEvent('dblclick', {
            clientX: px.x, clientY: px.y, bubbles: true, view: window
        }));
    }
}

function injectWheel(x, y, deltaY) {
    // Direct API scroll (always works) + real WheelEvent for mouse-aware apps
    const lines = Math.round(deltaY / 30);
    if (lines !== 0) term.scrollLines(lines);
    const el = document.querySelector('.xterm');
    if (el) el.dispatchEvent(new WheelEvent('wheel', {
        deltaY: deltaY, clientX: x, clientY: y,
        bubbles: true, cancelable: true, view: window
    }));
}

function injectDragSelect(x, y) {
    const c = pxToCell(x, y);
    if (tpCursorCol < 0) return;
    const vp = term.buffer.active.viewportY;
    const startCol = tpCursorCol, startRow = tpCursorRow + vp;
    const endCol = c.col, endRow = c.row + vp;
    const len = (endRow - startRow) * term.cols + (endCol - startCol);
    if (len > 0) term.select(startCol, startRow, len);
    else if (len < 0) term.select(endCol, endRow, -len);
    updateHandles();
    // Also dispatch real mousemove for mouse-aware apps
    const px = cellToPx(c.col, c.row);
    dispatchRealMouse('mousemove', px.x, px.y, 0);
}

// ======================== RESIZE ========================
const ro = new ResizeObserver(() => {
    fitAddon.fit();
    if (A) A.onTerminalResize(term.cols, term.rows);
});
ro.observe(termEl);

// ======================== PINCH TO ZOOM + 2-FINGER SCROLL ========================
let pinchStartDist = 0, pinchStartSize = 0;
let twoFingerStartY = 0, twoFingerMode = null; // 'pinch' | 'scroll' | null
let scrollAccum = 0;
termEl.addEventListener('touchstart', e => {
    if (e.touches.length === 2) {
        const dx = e.touches[0].clientX - e.touches[1].clientX;
        const dy = e.touches[0].clientY - e.touches[1].clientY;
        pinchStartDist = Math.sqrt(dx*dx + dy*dy);
        pinchStartSize = term.options.fontSize;
        twoFingerStartY = (e.touches[0].clientY + e.touches[1].clientY) / 2;
        twoFingerMode = null;
        scrollAccum = 0;
    }
}, {passive:true});
termEl.addEventListener('touchmove', e => {
    if (e.touches.length === 2 && pinchStartDist > 0) {
        e.preventDefault(); // Prevent browser from intercepting 2-finger gestures
        const dx = e.touches[0].clientX - e.touches[1].clientX;
        const dy = e.touches[0].clientY - e.touches[1].clientY;
        const dist = Math.sqrt(dx*dx + dy*dy);
        const midY = (e.touches[0].clientY + e.touches[1].clientY) / 2;
        const distChange = Math.abs(dist - pinchStartDist);
        const yChange = Math.abs(midY - twoFingerStartY);

        // Decide mode on first significant movement
        if (!twoFingerMode && (distChange > 20 || yChange > 20)) {
            twoFingerMode = distChange > yChange ? 'pinch' : 'scroll';
        }

        if (twoFingerMode === 'pinch') {
            const scale = dist / pinchStartDist;
            const newSize = Math.round(pinchStartSize * scale);
            const clamped = Math.max(8, Math.min(32, newSize));
            if (clamped !== term.options.fontSize) {
                term.options.fontSize = clamped;
                fitAddon.fit();
            }
        } else if (twoFingerMode === 'scroll') {
            const deltaY = twoFingerStartY - midY;
            const lineHeight = term.options.fontSize * 1.2;
            scrollAccum += deltaY;
            const lines = Math.trunc(scrollAccum / lineHeight);
            if (lines !== 0) {
                term.scrollLines(lines);
                scrollAccum -= lines * lineHeight;
            }
            twoFingerStartY = midY;
        }
    }
}, {passive:false});
termEl.addEventListener('touchend', () => { pinchStartDist = 0; twoFingerMode = null; }, {passive:true});

// ======================== SNIPPETS ========================
function setSnippets(snippets) {
    const bar = document.getElementById('snippetBar');
    bar.innerHTML = '';
    if (!snippets || snippets.length === 0) { bar.style.display = 'none'; return; }
    bar.style.display = 'flex';
    for (const cmd of snippets) {
        const btn = document.createElement('button');
        btn.className = 'snip-btn';
        btn.textContent = cmd.length > 20 ? cmd.substring(0,18) + '..' : cmd;
        btn.title = cmd;
        btn.addEventListener('click', () => { if (A) A.onTerminalInput(cmd + '\n'); });
        bar.appendChild(btn);
    }
}

// ======================== API (called from Android) ========================
function writeOutput(text) { term.write(text); }
function writeInfo(text) { term.write('\x1b[33m' + text + '\x1b[0m'); }
function clearTerminal() { term.clear(); }

function setFontSize(size) {
    term.options.fontSize = size;
    fitAddon.fit();
}

function setScrollback(lines) {
    term.options.scrollback = lines;
}

function applyColorScheme(name) {
    const scheme = SCHEMES[name];
    if (!scheme) return;
    term.options.theme = scheme;
    document.body.style.background = scheme.background;
    currentSchemeIdx = schemeNames.indexOf(name);
}

function exportScrollback() {
    const lines = [];
    const buf = term.buffer.active;
    for (let i = 0; i < buf.length; i++) {
        const line = buf.getLine(i);
        if (line) lines.push(line.translateToString(true));
    }
    if (A) A.exportScrollback(lines.join('\n'));
}

// ======================== SUPPRESS ANDROID KEYBOARD ========================
function suppressKeyboard() {
    document.querySelectorAll('.xterm-helper-textarea, textarea, input').forEach(el => {
        el.setAttribute('inputmode', 'none');
    });
}
const imeObserver = new MutationObserver(mutations => {
    for (const m of mutations) for (const node of m.addedNodes) {
        if (node.nodeType !== 1) continue;
        if (node.matches && node.matches('textarea,input,.xterm-helper-textarea'))
            node.setAttribute('inputmode', 'none');
        if (node.querySelectorAll)
            node.querySelectorAll('textarea,input,.xterm-helper-textarea').forEach(
                el => el.setAttribute('inputmode', 'none'));
    }
});
imeObserver.observe(document.body, { childList: true, subtree: true });

// ======================== INIT ========================
if (A) {
    setTimeout(() => {
        fitAddon.fit();
        suppressKeyboard();
        A.onTerminalReady(term.cols, term.rows);
    }, 100);
}
</script>

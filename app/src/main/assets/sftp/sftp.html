<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
html, body { background:#1E1E1E; color:#ccc; font-family:-apple-system,sans-serif; height:100%; overflow:hidden; display:flex; flex-direction:column; }
#toolbar { display:flex; align-items:center; gap:6px; padding:8px 12px; background:#252526; border-bottom:1px solid rgba(255,255,255,0.08); flex-shrink:0; flex-wrap:wrap; }
#pathInput { flex:1; min-width:120px; padding:6px 10px; font-size:13px; background:rgba(255,255,255,0.08); color:#ddd; border:1px solid rgba(255,255,255,0.15); border-radius:4px; font-family:monospace; }
.tb { padding:6px 12px; font-size:12px; background:rgba(255,255,255,0.08); color:#aaa; border:none; border-radius:4px; cursor:pointer; white-space:nowrap; }
.tb:active { background:rgba(0,122,204,0.4); }
.tb.accent { background:#58A6FF; color:#fff; }
.tb.danger { background:#c33; color:#fff; }
/* Selection bar (hidden by default) */
#selBar { display:none; align-items:center; gap:6px; padding:6px 12px; background:#1a3a5c; flex-shrink:0; }
#selBar.active { display:flex; }
#selCount { font-size:13px; color:#6cb6ff; flex:1; }
#status { padding:4px 12px; font-size:11px; color:#888; background:#1a1a1a; flex-shrink:0; }
/* Progress bar */
#progressBar { height:3px; background:#333; flex-shrink:0; }
#progressFill { height:100%; width:0%; background:#58A6FF; transition:width 0.2s; }
#fileList { flex:1; overflow-y:auto; padding:4px 0; }
.file-item { display:flex; align-items:center; padding:10px 12px; border-bottom:1px solid rgba(255,255,255,0.04); cursor:pointer; gap:10px; }
.file-item:active { background:rgba(0,122,204,0.15); }
.file-item.selected { background:rgba(0,122,204,0.2); }
.fi-check { width:22px; height:22px; border:2px solid #555; border-radius:4px; flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:14px; }
.file-item.selected .fi-check { background:#58A6FF; border-color:#58A6FF; color:#fff; }
.fi-icon { font-size:18px; width:24px; text-align:center; flex-shrink:0; }
.fi-name { flex:1; font-size:14px; color:#ddd; word-break:break-all; }
.fi-dir .fi-name { color:#6cb6ff; }
.fi-info { font-size:11px; color:#666; white-space:nowrap; }
</style>
</head>
<body>
<div id="toolbar">
    <button class="tb danger" id="btnBack">Close</button>
    <button class="tb" id="btnUp">Up</button>
    <input id="pathInput" type="text" value="/">
    <button class="tb" id="btnGo">Go</button>
    <button class="tb accent" id="btnUpload">Upload</button>
    <button class="tb" id="btnMkdir">Mkdir</button>
    <button class="tb" id="btnSelectAll">Select All</button>
</div>
<div id="selBar">
    <span id="selCount">0 selected</span>
    <button class="tb accent" id="selDownload">Download</button>
    <button class="tb danger" id="selDelete">Delete</button>
    <button class="tb" id="selClear">Cancel</button>
</div>
<div id="progressBar"><div id="progressFill"></div></div>
<div id="status">Connecting...</div>
<div id="fileList"></div>
<script>
'use strict';
const A = window.Android;
let currentPath = '/';
let allFiles = [];
const selected = new Set();

function showStatus(msg) { document.getElementById('status').textContent = msg; }
function setPath(p) { currentPath = p; document.getElementById('pathInput').value = p; }
function setProgress(pct) { document.getElementById('progressFill').style.width = pct + '%'; }

function formatSize(bytes) {
    if (bytes < 1024) return bytes + ' B';
    if (bytes < 1048576) return (bytes/1024).toFixed(1) + ' KB';
    if (bytes < 1073741824) return (bytes/1048576).toFixed(1) + ' MB';
    return (bytes/1073741824).toFixed(1) + ' GB';
}

function fullPath(name) {
    return currentPath + (currentPath.endsWith('/') ? '' : '/') + name;
}

function updateSelBar() {
    const bar = document.getElementById('selBar');
    if (selected.size > 0) {
        bar.classList.add('active');
        document.getElementById('selCount').textContent = selected.size + ' selected';
    } else {
        bar.classList.remove('active');
    }
    // Update visual selection
    document.querySelectorAll('.file-item').forEach(el => {
        const name = el.dataset.name;
        el.classList.toggle('selected', selected.has(name));
    });
}

function toggleSelect(name) {
    if (selected.has(name)) selected.delete(name);
    else selected.add(name);
    updateSelBar();
}

function renderDir(items) {
    const list = document.getElementById('fileList');
    list.innerHTML = '';
    selected.clear();
    updateSelBar();
    const parsed = (typeof items === 'string') ? JSON.parse(items) : items;
    parsed.sort((a,b) => {
        if (a.isDir !== b.isDir) return a.isDir ? -1 : 1;
        return a.name.localeCompare(b.name);
    });
    allFiles = parsed;

    for (const f of parsed) {
        const item = document.createElement('div');
        item.className = 'file-item' + (f.isDir ? ' fi-dir' : '');
        item.dataset.name = f.name;

        const check = document.createElement('div');
        check.className = 'fi-check';
        check.addEventListener('click', ev => {
            ev.stopPropagation();
            if (f.name !== '..') toggleSelect(f.name);
        });

        const icon = document.createElement('span');
        icon.className = 'fi-icon';
        icon.textContent = f.isDir ? '\uD83D\uDCC1' : '\uD83D\uDCC4';

        const name = document.createElement('span');
        name.className = 'fi-name';
        name.textContent = f.name;

        const info = document.createElement('span');
        info.className = 'fi-info';
        info.textContent = f.isDir ? f.perms : formatSize(f.size);

        item.appendChild(check);
        item.appendChild(icon);
        item.appendChild(name);
        item.appendChild(info);

        item.addEventListener('click', () => {
            if (selected.size > 0) {
                // In selection mode: toggle instead of navigate
                if (f.name !== '..') toggleSelect(f.name);
            } else if (f.isDir) {
                let newPath;
                if (f.name === '..') {
                    newPath = currentPath.replace(/\/[^/]+\/?$/, '') || '/';
                } else {
                    newPath = fullPath(f.name);
                }
                setPath(newPath);
                if (A) A.navigate(newPath);
            }
        });

        // Long-press to start selection
        let lpTimer = null;
        item.addEventListener('touchstart', () => {
            if (f.name === '..') return;
            lpTimer = setTimeout(() => { toggleSelect(f.name); }, 400);
        }, {passive:true});
        item.addEventListener('touchmove', () => { clearTimeout(lpTimer); }, {passive:true});
        item.addEventListener('touchend', () => { clearTimeout(lpTimer); }, {passive:true});

        list.appendChild(item);
    }
}

function refreshDir() { if (A) A.navigate(currentPath); }

// Toolbar
document.getElementById('btnBack').addEventListener('click', () => { if (A) A.closeSftp(); });
document.getElementById('btnUp').addEventListener('click', () => {
    const parent = currentPath.replace(/\/[^/]+\/?$/, '') || '/';
    setPath(parent);
    if (A) A.navigate(parent);
});
document.getElementById('btnGo').addEventListener('click', () => {
    const p = document.getElementById('pathInput').value.trim();
    if (p) { setPath(p); if (A) A.navigate(p); }
});
document.getElementById('btnUpload').addEventListener('click', () => {
    if (A) A.uploadFiles(currentPath);
});
document.getElementById('btnMkdir').addEventListener('click', () => {
    if (A) A.promptMkdir(currentPath);
});
document.getElementById('btnSelectAll').addEventListener('click', () => {
    const nonDot = allFiles.filter(f => f.name !== '..');
    if (selected.size === nonDot.length) {
        selected.clear();
    } else {
        nonDot.forEach(f => selected.add(f.name));
    }
    updateSelBar();
});

// Selection bar actions
document.getElementById('selDownload').addEventListener('click', () => {
    const items = [];
    for (const name of selected) {
        const f = allFiles.find(x => x.name === name);
        if (f) items.push({name: f.name, isDir: f.isDir, path: fullPath(f.name)});
    }
    if (A) A.downloadMultiple(JSON.stringify(items));
});
document.getElementById('selDelete').addEventListener('click', () => {
    const items = [];
    for (const name of selected) items.push(fullPath(name));
    if (A) A.confirmDeleteMultiple(JSON.stringify(items), selected.size);
});
document.getElementById('selClear').addEventListener('click', () => {
    selected.clear();
    updateSelBar();
});
</script>
</body>
</html>
